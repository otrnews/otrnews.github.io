name: Update OTR News

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: otrnews
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools (shrinks your photos)
        run: pip install pillow

      - name: Pull latest headlines and build site
        run: python build.py

      - name: Save story archive
        run: |
          git config user.name "otrnews-bot"
          git config user.email "otrnews-bot@users.noreply.github.com"
          git add data/items.json
          git diff --staged --quiet || (git commit -m "Update news archive" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
