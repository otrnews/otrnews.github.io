name: Update OTR News

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: otrnews
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools (shrinks your photos)
        run: pip install pillow

      - name: Refresh job listings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetch_jobs.py || echo "Job refresh failed; keeping the last listings"

      - name: Add photos to articles that need one
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python fetch_photos.py || echo "Photo step skipped"

      - name: Pull latest headlines and build site
        run: python build.py

      - name: Save story archive
        run: |
          git config user.name "otrnews-bot"
          git config user.email "otrnews-bot@users.noreply.github.com"
          git add data/items.json
          for p in data posts images; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --staged --quiet || (git commit -m "Update news archive" && git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
